[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-toolkit"
version = "0.1.0"
description = "Distribution free prediction intervals and sets in pure NumPy: split, normalized, CQR, jackknife+/CV+, LAC/APS/RAPS, Mondrian and adaptive conformal inference"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["conformal"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
